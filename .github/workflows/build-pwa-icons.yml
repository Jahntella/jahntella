name: Build Jahntella App Icons
on:
  push:
    branches: [main]
    paths:
      - 'app-icons/jahntella-icon.svg'
      - '.github/workflows/build-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon renderer
        run: python -m pip install cairosvg
      - name: Generate standard Android and iPhone icons
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          svg=Path('app-icons/jahntella-icon.svg').read_bytes()
          for size in (180,192,512):
              cairosvg.svg2png(bytestring=svg,write_to=f'app-icons/jahntella-{size}.png',output_width=size,output_height=size)
          PY
      - name: Commit app icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-icons/jahntella-180.png app-icons/jahntella-192.png app-icons/jahntella-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Build mobile app icon sizes [skip ci]"
            git push
          fi
