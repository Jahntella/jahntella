name: Verify Jahntella App Icons
on:
  push:
    branches: [main]
    paths:
      - 'app-icons/jahntella-180.png'
      - 'app-icons/jahntella-192.png'
      - 'app-icons/jahntella-512.png'
      - 'app-icons/jahntella-1024.png'
      - '.github/workflows/build-pwa-icons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved glossy icons (never auto-replace artwork)
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          for size in (180,192,512,1024):
              path=Path(f'app-icons/jahntella-{size}.png')
              data=path.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'{path}: not a PNG'
              w,h=struct.unpack('>II',data[16:24])
              assert (w,h)==(size,size), f'{path}: expected {size}x{size}, got {w}x{h}'
              print(path,'OK')
          PY
