name: Build song social previews
on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-social-previews.py'
      - '.github/workflows/build-song-social-previews.yml'
      - 'songs/*.html'
      - 'JKeepUpWithMeFixed.png'
      - 'JRedLightGo.png'
      - 'JSpotlight.png'
      - 'JTurnAround.png'
      - 'JWhatsYourSign.png'
      - 'JYouSawMe.png'
      - 'JWhenTheSunComesBack.png'
      - 'JLosingIt.png'
      - 'JYouremissingtheparty.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-social-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Render 1200x630 artwork and update previews
        run: python tools/generate-social-previews.py
      - name: Commit the generated preview images and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social songs
          if ! git diff --cached --quiet; then
            git commit -m "Build full-cover Facebook and social preview cards [skip ci]"
            git push
          fi
