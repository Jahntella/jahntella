<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#120015">
  <meta name="color-scheme" content="dark">
  <title>Jahntella™ — Loading</title>
  <style>
    html,body{margin:0;min-height:100%;background:#120015;color:#fff}
    body{min-height:100vh;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .instant-loader{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(137,36,162,.28),transparent 42%),#120015}
    .instant-loader-inner{text-align:center;padding:2rem}
    .instant-loader-mark{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,7vw,3.4rem);letter-spacing:.02em;color:#fff}
    .instant-loader-mark span{color:#ff8dcc}
    .instant-loader-line{width:min(180px,50vw);height:2px;margin:1rem auto 0;background:rgba(255,255,255,.12);overflow:hidden;border-radius:999px}
    .instant-loader-line i{display:block;width:42%;height:100%;background:linear-gradient(90deg,transparent,#ff8dcc,#d6a4ff,transparent);animation:instantLoad 1.05s ease-in-out infinite}
    @keyframes instantLoad{0%{transform:translateX(-130%)}100%{transform:translateX(320%)}}
  </style>
</head>
<body>
  <div class="instant-loader" aria-label="Loading Jahntella">
    <div class="instant-loader-inner">
      <div class="instant-loader-mark">Jahntella<span>♡</span></div>
      <div class="instant-loader-line" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <script>
    (async () => {
      const source = 'https://raw.githubusercontent.com/Jahntella/jahntella/e331b6900f12b4cd1d9c16fcc6c9aa236f4c6e8c/index.html';
      try {
        const response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load the original homepage.');
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const gallery = doc.querySelector('#gallery.gallery-section');
        const about = doc.querySelector('#about.about-section');
        if (gallery && about) {
          about.parentNode.insertBefore(gallery, about);
          const heading = gallery.querySelector('.section-heading');
          if (heading && !heading.querySelector('#galleryListenPrompt')) {
            const prompt = doc.createElement('p');
            prompt.id = 'galleryListenPrompt';
            prompt.className = 'gallery-listen-prompt';
            prompt.textContent = 'Click Your Favorite Cover Art to Listen';
            heading.appendChild(prompt);
          }
        }

        const count = doc.querySelector('#newMusicTitle');
        if (count) count.innerHTML = count.innerHTML.replace(/\b15 new songs\b/gi, '16 new songs');

        const main = doc.querySelector('main');
        const footer = doc.querySelector('footer');
        if (main && footer && !doc.getElementById('shyGuyShawnTribute')) {
          const tribute = doc.createElement('section');
          tribute.id = 'shyGuyShawnTribute';
          tribute.className = 'shy-guy-shawn-tribute';
          tribute.innerHTML = '<div class="shy-guy-shawn-rule" aria-hidden="true"></div><p>Peace to <strong>Shy Guy Shawn</strong> <span>♡</span></p><small>Thank You</small>';
          footer.parentNode.insertBefore(tribute, footer);
        }

        const shineIntro = Array.from(doc.querySelectorAll('p')).find(node =>
          node.textContent.includes('Get your first look at') && node.textContent.includes('The Shine Era')
        );
        if (shineIntro) {
          shineIntro.innerHTML = 'Get your first look at <strong>The Shine Era</strong>—front and back—and step inside <strong>Sweet Dreams</strong>, <strong>We Are 1</strong>, <strong>Boots, Smile &amp; Attitude</strong>, and <strong>Midnight Rodeo</strong>—four glimpses of the sound, light, and world of Album II.';
        }

        const style = doc.createElement('style');
        style.textContent = `
          .gallery-listen-prompt{margin:.45rem auto 0;color:rgba(255,255,255,.82);font-size:.9rem;font-weight:700;letter-spacing:.04em;text-align:center}
          @media(max-width:600px){.gallery-listen-prompt{font-size:.82rem}}
          .shy-guy-shawn-tribute{padding:3.5rem 1.25rem 2.25rem;text-align:center;background:linear-gradient(180deg,rgba(18,0,21,0),rgba(18,0,21,.5))}
          .shy-guy-shawn-rule{width:72px;height:1px;margin:0 auto 1rem;background:linear-gradient(90deg,transparent,rgba(255,185,233,.8),transparent)}
          .shy-guy-shawn-tribute p{margin:0;color:rgba(255,255,255,.88);font-family:"Playfair Display",serif;font-size:clamp(1.05rem,2vw,1.35rem);letter-spacing:.02em}
          .shy-guy-shawn-tribute p strong{color:#ffd1f2;font-weight:700}
          .shy-guy-shawn-tribute p span{display:inline-block;margin-left:.25rem;color:#ff8dcc}
          .shy-guy-shawn-tribute small{display:block;margin-top:.5rem;color:rgba(255,255,255,.55);font-size:.68rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
        `;
        doc.head.appendChild(style);

        const finalHtml = '<!doctype html>\n' + doc.documentElement.outerHTML;
        document.open();
        document.write(finalHtml);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#120015;color:#fff;font-family:system-ui;padding:3rem;box-sizing:border-box;text-align:center">Jahntella is loading. Please refresh the page.</main>';
      }
    })();
  </script>
</body>
</html>
