<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Jahntella™ — Loading</title>
  <style>html,body{margin:0;background:#120015;color:#fff}body{min-height:100vh}</style>
</head>
<body>
  <div aria-hidden="true" style="min-height:100vh;background:radial-gradient(circle at 50% 20%,#300034 0,#120015 55%,#09000f 100%);display:grid;place-items:center;font-family:system-ui,sans-serif"><div style="text-align:center;color:#ffd7f3;font-weight:700;letter-spacing:.08em">Jahntella<span style="color:#ff8dcc">♡</span><div style="width:92px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,#ff8dcc,transparent);animation:loaderPulse 1s ease-in-out infinite alternate"></div></div></div>
  <style>@keyframes loaderPulse{from{opacity:.35;transform:scaleX(.55)}to{opacity:1;transform:scaleX(1)}}</style>
  <script>
    (async () => {
      const source = 'https://raw.githubusercontent.com/Jahntella/jahntella/e331b6900f12b4cd1d9c16fcc6c9aa236f4c6e8c/index.html';
      try {
        const response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load the original homepage.');
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const gallery = doc.querySelector('#gallery.gallery-section');
        const about = doc.querySelector('#about.about-section');
        if (gallery && about) {
          about.parentNode.insertBefore(gallery, about);
          const heading = gallery.querySelector('.section-heading');
          if (heading && !heading.querySelector('#galleryListenPrompt')) {
            const prompt = doc.createElement('p');
            prompt.id = 'galleryListenPrompt';
            prompt.className = 'gallery-listen-prompt';
            prompt.textContent = 'Click Your Favorite Cover Art to Listen';
            heading.appendChild(prompt);
          }
        }

        const count = doc.querySelector('#newMusicTitle');
        if (count) count.innerHTML = count.innerHTML.replace(/\b15 new songs\b/gi, '16 new songs');

        const main = doc.querySelector('main');
        const footer = doc.querySelector('footer');
        if (main && footer && !doc.getElementById('shyGuyShawnTribute')) {
          const tribute = doc.createElement('section');
          tribute.id = 'shyGuyShawnTribute';
          tribute.className = 'shy-guy-shawn-tribute';
          tribute.innerHTML = '<div class="shy-guy-shawn-rule" aria-hidden="true"></div><p>Peace to <strong>Shy Guy Shawn</strong> <span>♡</span></p><small>Thank You</small>';
          footer.parentNode.insertBefore(tribute, footer);
        }

        const shineIntro = Array.from(doc.querySelectorAll('p')).find(node =>
          node.textContent.includes('Get your first look at') && node.textContent.includes('The Shine Era')
        );
        if (shineIntro) {
          shineIntro.innerHTML = 'Get your first look at <strong>The Shine Era</strong>—front and back—and step inside <strong>Sweet Dreams</strong>, <strong>We Are 1</strong>, <strong>Boots, Smile &amp; Attitude</strong>, <strong>Redline</strong>, and <strong>Midnight Rodeo</strong>—five glimpses of the sound, light, and world of Album II.';
        }

        doc.querySelectorAll('#gallery .gallery-item').forEach(item => {
          const img = item.querySelector('img');
          const path = (img?.getAttribute('src') || item.getAttribute('data-lightbox') || '').split(/[?#]/)[0];
          const filename = decodeURIComponent(path.split('/').pop() || '').toLowerCase();
          const alt = (img?.getAttribute('alt') || '').toLowerCase();
          const isNonMusicCloseup = /jahntella-official-v1\.png|jahntella-official\.png|jahntella-closeup|jahntella-portrait/.test(filename)
            || (/jahntella/.test(alt) && /(close.?up|portrait|face)/.test(alt) && !/cover|song|music|single/.test(alt));
          if (isNonMusicCloseup) item.remove();
        });

        const galleryThumbs = {
          'bite-lip-cover.webp':'assets/music-thumbs/bite-lip.webp',
          'gloss-cover.webp':'assets/music-thumbs/gloss.webp',
          'i-want-to-be-your-girl-cover.webp':'assets/music-thumbs/i-want-to-be-your-girl.webp',
          'embrace-me-cover.webp':'assets/music-thumbs/embrace-me.webp',
          'we-come-together-cover.webp':'assets/music-thumbs/we-come-together.webp',
          'play-with-me-cover.webp':'assets/music-thumbs/play-with-me.webp',
          'carnival-cover.webp':'assets/music-thumbs/carnival.webp',
          'made-of-light-cover.webp':'assets/music-thumbs/made-of-light.webp',
          'candy-wrapper-cover.webp':'assets/music-thumbs/candy-wrapper.webp',
          'playground-cover.webp':'assets/music-thumbs/playground.webp',
          'milk-shake-cover.webp':'assets/music-thumbs/milk-shake.webp',
          'tonight-cover.webp':'assets/music-thumbs/tonight.webp',
          'sweet-dreams-cover.webp':'assets/album2/sweet-dreams-cover-thumb.webp',
          'we-are-1-cover.webp':'assets/album2/we-are-1-cover-thumb.webp',
          'boots-smile-attitude-cover.webp':'assets/album2/boots-smile-attitude-cover-thumb.webp',
          'midnight-rodeo-cover.webp':'assets/album2/midnight-rodeo-cover-thumb.webp',
          'redline-cover.webp':'assets/album2/redline-cover-thumb.webp'
        };

        const galleryOrder = [
          'fun-dipp-cover.webp',
          'pink-lips-remix.webp',
          'bite-lip-cover.webp',
          'i-want-to-be-your-girl-cover.webp',
          'gloss-cover.webp',
          'embrace-me-cover.webp',
          'we-come-together-cover.webp',
          'play-with-me-cover.webp',
          'carnival-cover.webp',
          'made-of-light-cover.webp',
          'candy-wrapper-cover.webp',
          'playground-cover.webp',
          'milk-shake-cover.webp',
          'tonight-cover.webp',
          'sweet-dreams-cover.webp',
          'we-are-1-cover.webp',
          'boots-smile-attitude-cover.webp',
          'midnight-rodeo-cover.webp',
          'redline-cover.webp'
        ];
        const galleryGrid = doc.querySelector('#gallery .gallery-grid');
        if (galleryGrid) {
          const orderMap = new Map(galleryOrder.map((name,index) => [name,index]));
          const items = Array.from(galleryGrid.querySelectorAll(':scope > .gallery-item'));
          items.sort((a,b) => {
            const filename = item => {
              const img = item.querySelector('img');
              const path = (img?.getAttribute('src') || item.getAttribute('data-lightbox') || '').split(/[?#]/)[0];
              return decodeURIComponent(path.split('/').pop() || '').toLowerCase();
            };
            const ai = orderMap.has(filename(a)) ? orderMap.get(filename(a)) : 10000;
            const bi = orderMap.has(filename(b)) ? orderMap.get(filename(b)) : 10000;
            return ai - bi;
          });
          items.forEach(item => galleryGrid.appendChild(item));
          galleryGrid.style.gridAutoFlow = 'row';
        }

        doc.querySelectorAll('#gallery .gallery-item').forEach(item => {
          const img = item.querySelector('img');
          if (!img) return;
          const path = (img.getAttribute('src') || '').split(/[?#]/)[0];
          const filename = decodeURIComponent(path.split('/').pop() || '').toLowerCase();
          const thumb = galleryThumbs[filename];
          if (thumb) img.setAttribute('src', thumb);
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
          img.setAttribute('fetchpriority', 'low');
          if (!img.getAttribute('width')) img.setAttribute('width','420');
          if (!img.getAttribute('height')) img.setAttribute('height','420');
        });

        const style = doc.createElement('style');
        style.textContent = `
          .gallery-listen-prompt{margin:.45rem auto 0;color:rgba(255,255,255,.82);font-size:.9rem;font-weight:700;letter-spacing:.04em;text-align:center}
          @media(max-width:600px){.gallery-listen-prompt{font-size:.82rem}}
          .gallery-section{content-visibility:auto;contain-intrinsic-size:1200px 1650px}
          .gallery-section .gallery-grid{contain:layout paint style;grid-auto-flow:row!important}
          .shy-guy-shawn-tribute{padding:3.5rem 1.25rem 2.25rem;text-align:center;background:linear-gradient(180deg,rgba(18,0,21,0),rgba(18,0,21,.5))}
          .shy-guy-shawn-rule{width:72px;height:1px;margin:0 auto 1rem;background:linear-gradient(90deg,transparent,rgba(255,185,233,.8),transparent)}
          .shy-guy-shawn-tribute p{margin:0;color:rgba(255,255,255,.88);font-family:"Playfair Display",serif;font-size:clamp(1.05rem,2vw,1.35rem);letter-spacing:.02em}
          .shy-guy-shawn-tribute p strong{color:#ffd1f2;font-weight:700}
          .shy-guy-shawn-tribute p span{display:inline-block;margin-left:.25rem;color:#ff8dcc}
          .shy-guy-shawn-tribute small{display:block;margin-top:.5rem;color:rgba(255,255,255,.55);font-size:.68rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
        `;
        doc.head.appendChild(style);

        const album2Script = doc.querySelector('script[src*="album2-preview-config.js"]');
        if (album2Script) album2Script.setAttribute('src', 'album2-preview-config.js?v=2026.08.19.5');
        const midnightScript = doc.querySelector('script[src*="midnight-rodeo-site.js"]');
        if (midnightScript) midnightScript.setAttribute('src', 'midnight-rodeo-site.js?v=2026.08.20.1');
        const redlineScript = doc.querySelector('script[src*="redline-site.js"]');
        if (redlineScript) redlineScript.setAttribute('src', 'redline-site.js?v=2026.08.20.1');

        const finalHtml = '<!doctype html>\n' + doc.documentElement.outerHTML;
        document.open();
        document.write(finalHtml);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="font-family:system-ui;padding:3rem;background:#120015;color:#ffd7f3;min-height:100vh">Jahntella is loading. Please refresh the page.</main>';
      }
    })();
  </script>
</body>
</html>
