<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="Jahntella The Synergy Era back cover, nine songs in album order">
<defs>
<radialGradient id="bg"><stop offset="0" stop-color="#922b46"/><stop offset=".55" stop-color="#430d25"/><stop offset="1" stop-color="#130611"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset=".3" stop-color="#e9bfc3"/><stop offset=".57" stop-color="#fef0ec"/><stop offset=".8" stop-color="#9c6376"/><stop offset="1" stop-color="#fff2ed"/></linearGradient>
<linearGradient id="rim"><stop stop-color="#e3858f"/><stop offset=".5" stop-color="#fff0eb"/><stop offset="1" stop-color="#d94f73"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="40"/></filter>
<style>
.title{font-family:Georgia,serif;font-weight:700;font-size:89px;letter-spacing:7px;fill:url(#metal)}
.eyebrow{font-family:Arial,sans-serif;font-size:23px;font-weight:700;letter-spacing:10px;fill:#f4bac7}
.track{font-family:Arial,Helvetica,sans-serif;font-size:36px;font-weight:600;letter-spacing:.5px;fill:#fff3ee}
.num{font-family:Arial,sans-serif;font-size:31px;font-weight:700;letter-spacing:2px;fill:#f6afbe}
</style></defs>
<rect width="1254" height="1254" fill="url(#bg)"/>
<ellipse cx="100" cy="260" rx="180" ry="560" fill="#fa5573" opacity=".24" filter="url(#glow)"/><ellipse cx="1110" cy="840" rx="190" ry="470" fill="#e94c6e" opacity=".22" filter="url(#glow)"/>
<path d="M90 100L1150 1150M1160 70L100 1180" stroke="#fa768d" stroke-width="5" opacity=".2"/>
<rect x="40" y="40" width="1174" height="1174" rx="22" fill="none" stroke="url(#rim)" stroke-width="3"/>
<rect x="70" y="72" width="1114" height="1110" rx="10" fill="#160817" opacity=".62" stroke="#d5768d" stroke-opacity=".4"/>
<text x="627" y="160" text-anchor="middle" class="eyebrow">JAHNTELLA · ALBUM VI</text>
<text x="627" y="262" text-anchor="middle" class="title">SYNERGY</text>
<text x="627" y="310" text-anchor="middle" class="eyebrow" style="font-size:20px;letter-spacing:7px">THE SYNERGY ERA · CRIMSON &amp; CHROME</text>
<path d="M175 342H1078" stroke="url(#rim)" stroke-width="2"/>
<g transform="translate(0 405)"><g transform="translate(0 0)"><text x="172" y="0" class="num">01</text><text x="257" y="0" class="track">Keep Up With Me</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 89)"><text x="172" y="0" class="num">02</text><text x="257" y="0" class="track">Red Light Go</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 178)"><text x="172" y="0" class="num">03</text><text x="257" y="0" class="track">Spotlight</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 267)"><text x="172" y="0" class="num">04</text><text x="257" y="0" class="track">Turn Around</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 356)"><text x="172" y="0" class="num">05</text><text x="257" y="0" class="track">What&apos;s Your Sign?</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 445)"><text x="172" y="0" class="num">06</text><text x="257" y="0" class="track">You Saw Me</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 534)"><text x="172" y="0" class="num">07</text><text x="257" y="0" class="track">When the Sun Comes Back</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 623)"><text x="172" y="0" class="num">08</text><text x="257" y="0" class="track">Losing It</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g>
<g transform="translate(0 712)"><text x="172" y="0" class="num">09</text><text x="257" y="0" class="track">You&apos;re Missing the Party</text><path d="M172 18H1080" stroke="#e59b9f" opacity=".24" stroke-width="1"/></g></g>
<path d="M175 1150H1078" stroke="url(#rim)" stroke-width="2"/>
<text x="627" y="1180" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:17px;letter-spacing:5px;fill:#eec8cc">SIX ERAS · OVER 60 SONGS · THE WORLD OF SWEET ♡</text>
</svg>